<body>

<h2>特殊言語 [aruqa] トランスレートシステム(非公開)</h2>

<div class="section">
  このシステムは、外部に流出するのを想定していないシステムです。<br>
  もし漏洩が起こった場合は直ちに停止措置を開始して下さい。<br>
  <br>
  本システムは架空言語 aruqa を用いた内部記録・秘匿通信実験用翻訳装置です。<br>
  日本語 / アルカ語 / アルカ文字 は完全に相互変換可能であり、<br>
  構文解析はローマ字層でのみ行われます。
  <br>
</div>

<textarea id="input" placeholder="日本語 / アルカ語 / アルカ文字を入力"></textarea>

<div>
  <button id="toJa">アルカ語 → 日本語</button>
  <button id="toArca">日本語 → アルカ語</button>
  <button id="toScript">アルカ語 → アルカ文字</button>
  <button id="fromScript">アルカ文字 → アルカ語</button>
</div>

<textarea id="output" placeholder="翻訳結果"></textarea>

<!-- ===== 辞書 ===== -->
<script id="dictionary" type="application/json">
{

    "sisel": { "ja": "世界" },
    "qethus": { "ja": "保存" },

    "shirae": { "ja": "見る" },
    "kikra": { "ja": "聞く" },
    "yura": { "ja": "行く" },
    "kurae": { "ja": "来る" },
    "nema": { "ja": "眠る" },

    "kera": { "ja": "書く" },
    "yima": { "ja": "読む" },
    "zomra": { "ja": "思う" },
    "sira": { "ja": "知る" },
    "rome": { "ja": "変わる" },
    "qeso": { "ja": "存在する" }
  },
  "particles": {
    "a":  { "ja": "は" },
    "ga": { "ja": "が" },
    "en": { "ja": "を" },
    "ni": { "ja": "に" },
    "de": { "ja": "で" },
    "ru": { "ja": "も" },
    "ka": { "ja": "と" },

  },
  "grammar": {
    "-re":  { "ja": "する" },
    "-ir":  { "ja": "している" },
    "-an":  { "ja": "した" },
    "-el":  { "ja": "だろう" },
    "-eth": { "ja": "される" },
    "-si": { "ja": "たち" }
  },
  "pluralform": {
    "sel": { "ja": "複数の" }
  },
  "greeting": {
   "hile": { "ja": "こんにちは" },
   "bile": { "ja": "さようなら" }
  }
}
</script>

<script>
/* ===== アルカ文字体系 ===== */
const ARCA_SCRIPT = {
  a:"Λ", b:"β", c:"Ͼ", d:"Ð", e:"Ξ",
  f:"ϝ", g:"Ǥ", h:"Ή", i:"Ι", j:"Ј",
  k:"Ҡ", l:"Ł", m:"Μ", n:"Ν", o:"Θ",
  p:"ρ", q:"Φ", r:"Я", s:"Ϟ", t:"Ŧ",
  u:"Ц", v:"Ѵ", w:"Ш", x:"Ж", y:"Ұ",
  z:"Ȥ", "-":"·", " ":" "
};

const SCRIPT_TO_ARCA = Object.fromEntries(
  Object.entries(ARCA_SCRIPT).map(([k,v]) => [v,k])
);

const DICT = JSON.parse(
  document.getElementById("dictionary").textContent
);

function tokenize(text) {
  return text.trim().split(/\s+/);
}

function arcaToJapanese(text) {
  const tokens = tokenize(text);
  const out = [];

  tokens.forEach(tok => {
    let base = tok;
    let suf = "";

    if (tok.includes("-")) {
      const parts = tok.split("-");
      base = parts[0];
      suf = "-" + parts[1];
    }

    if (DICT.words[base]) {
  out.push(DICT.words[base].ja + (DICT.grammar[suf]?.ja || ""));
} else if (DICT.pluralform?.[base]) {
  out.push(DICT.pluralform[base].ja);
} else if (DICT.greeting?.[base]) {
  out.push(DICT.greeting[base].ja);
} else if (DICT.particles[base]) {
  out.push(DICT.particles[base].ja);
} else {
  out.push(base);
}
  });

  return out.join("");
}

function japaneseToArca(text) {
  let out = text;

  Object.entries(DICT.grammar).forEach(([k, v]) => {
    out = out.replaceAll(v.ja, k);
  });

  Object.entries(DICT.words).forEach(([a, d]) => {
    out = out.replaceAll(d.ja, a);
  });

  Object.entries(DICT.pluralform || {}).forEach(([a, d]) => {
  out = out.replaceAll(d.ja, a);
});

Object.entries(DICT.greeting || {}).forEach(([a, d]) => {
  out = out.replaceAll(d.ja, a);
});

  Object.entries(DICT.particles).forEach(([a, d]) => {
    out = out.replaceAll(d.ja, " " + a);
  });

  return out.trim();
}

function arcaToScript(text) {
  return text.toLowerCase().split("").map(c => ARCA_SCRIPT[c] || c).join("");
}

function scriptToArca(text) {
  return text.split("").map(c => SCRIPT_TO_ARCA[c] || c).join("");
}

const input = document.getElementById("input");
const output = document.getElementById("output");

document.getElementById("toJa").onclick = () => {
  output.value = arcaToJapanese(input.value);
};
document.getElementById("toArca").onclick = () => {
  output.value = japaneseToArca(input.value);
};
document.getElementById("toScript").onclick = () => {
  output.value = arcaToScript(input.value);
};
document.getElementById("fromScript").onclick = () => {
  output.value = scriptToArca(input.value);
};
</script>
